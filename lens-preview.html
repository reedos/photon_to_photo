<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Lens exterior preview</title>
<meta name="description" content="Standalone preview of a docs/PANE.md lineup lens's 3D exterior model: ?lens=n500&cutaway=1&focus=3&fno=8">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f0f0fa; font: 13px/1.4 ui-monospace, "IBM Plex Mono", monospace; }
  #gl { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  #status { position: fixed; left: 10px; bottom: 10px; padding: 6px 10px; background: rgba(0,0,0,.55); border-radius: 4px; pointer-events: none; }
  /* A developer's preview of one lens model, not a page of the site (noindex): it says so, and leads back to the camera
     (score loop r2: it was a dead end with only a debug line). */
  .dev-bar { position: fixed; left: 10px; top: 10px; display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 12px; background: rgba(0,0,0,.6); border-radius: 4px; }
  .dev-bar h1 { margin: 0; font: inherit; color: #b9c0cc; }
  .dev-bar span { color: #8b93a1; }
  .dev-bar a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: #e6ba82; text-decoration: none; border: 1px solid #e6ba8266; border-radius: 3px; }
  .dev-bar a:focus-visible { outline: 2px solid #e6ba82; outline-offset: 2px; }
</style>
</head>
<body>
<header class="dev-bar"><h1>Lens exterior preview</h1><span>developer tool</span><a href="./index.html?piece=camera">← The camera</a></header>
<main>
<canvas id="gl"></canvas>
<div id="status" role="status">Loading&hellip;</div>
</main>
<script type="module" src="/src/scene/lens-preview.ts"></script>
</body>
</html>
