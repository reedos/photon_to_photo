<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Body preview — Photon to Photo</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { font: 500 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; color: #f0f0fa; }
  #view { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; top: 10px; left: 12px; padding: 6px 10px; background: rgba(11,16,21,0.7);
    border: 1px solid rgba(240,240,250,0.14); border-radius: 4px; letter-spacing: 0.04em; z-index: 2;
  }
  .hud b { color: #e6ba82; }
</style>
</head>
<body>
<div id="view"><canvas id="gl" aria-label="Camera body preview. Drag to orbit, scroll to zoom."></canvas></div>
<div class="hud" id="hud">Photon to Photo &mdash; body preview</div>
<script type="module" src="/src/scene/preview.ts"></script>
</body>
</html>
